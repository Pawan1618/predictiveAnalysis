[server]
# Raise upload limit to 500 MB (default is 200 MB).
# The online_retail_II.csv is ~94 MB so this gives plenty of headroom.
maxUploadSize = 500

# Keep websocket connections alive longer for large file transfers.
# Default is 60 seconds which is too short for 94 MB uploads on slower machines.
maxMessageSize = 500

[browser]
# Suppress the "Do you want to use Streamlit's hosted tracking?" prompt
gatherUsageStats = false
